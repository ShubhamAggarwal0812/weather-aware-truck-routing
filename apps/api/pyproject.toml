[project]
name = "truck-routing-api"
version = "1.0.0"
description = "Django API for weather-aware truck routing"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<5.3",
    "djangorestframework>=3.16",
    "drf-spectacular>=0.28",
    "httpx>=0.28",
    "gunicorn>=23",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-django>=4.9",
    "respx>=0.22",
    "ruff>=0.12",
    "mypy>=1.17",
    "django-stubs[compatible-mypy]>=5.2,<5.3",
    "djangorestframework-stubs>=3.16",
]

[tool.uv]
package = false

[tool.vercel]
entrypoint = "config.wsgi:application"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "B905"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "common", "config"]

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
exclude = ["^tests/", "^\\.venv/"]

[[tool.mypy.overrides]]
module = ["drf_spectacular.*", "respx.*"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings.test"
